<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipNoter clip</title>
<link rel="stylesheet" href="clip.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="mark">“</span>ClipNoter</a>
    <a href="index.html" class="btn primary">Browse feed</a>
  </header>
  <div class="container" id="container">
    <p class="empty">Loading…</p>
  </div>

  <dialog id="claim-dialog" class="claim-dialog">
    <div class="dialog-inner">
      <h3>File a claim</h3>
      <p style="color:#777;font-size:13px;">If you're the original creator or rights holder and believe this clip should be reviewed or removed, tell us below.</p>
      <div class="field"><label>Your name</label><input id="claim-name" type="text" /></div>
      <div class="field"><label>Email</label><input id="claim-email" type="email" /></div>
      <div class="field"><label>Reason</label><textarea id="claim-reason" rows="4" placeholder="Explain the issue…"></textarea></div>
      <p id="claim-error" class="empty" style="display:none;color:#dc2626;padding:0;"></p>
      <div class="dialog-actions">
        <button class="btn" id="claim-cancel">Cancel</button>
        <button class="btn primary" id="claim-submit">Submit claim</button>
      </div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script type="module" src="clip.js"></script>
</body>
</html>
